name: Browser journeys

on:
  workflow_call:
    inputs:
      base-url:
        description: Deployed HTTP(S) origin; leave empty to test the build artifact
        type: string
        default: ''
      image:
        description: Image tag inside the docker-image artifact
        type: string
        default: ''
      suite:
        type: string
        default: full
      exercise:
        type: string
        default: '19'
    secrets:
      E2E_EMAIL:
        required: false
      E2E_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      base-url:
        description: Deployed HTTP(S) origin
        required: true
        type: string
      suite:
        description: Suite to run
        type: choice
        options: [smoke, full]
        default: smoke
      exercise:
        description: Exercise reserved for the dedicated E2E account
        default: '19'
        type: string

permissions:
  contents: read

concurrency:
  group: browser-journeys-${{ inputs.base-url || github.run_id }}
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.base-url == '' && inputs.image != ''
        with:
          name: docker-image
          path: /tmp
      - run: docker load --input /tmp/image.tar
        if: inputs.base-url == '' && inputs.image != ''
      - run: pip install -r requirements-e2e.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - run: python -m playwright install --with-deps chromium
      - name: Run browser journeys
        run: python -m pytest e2e/ -v -m "$E2E_MARKERS" --tracing retain-on-failure --screenshot only-on-failure
        env:
          E2E_BASE_URL: ${{ inputs.base-url }}
          E2E_IMAGE: ${{ inputs.image }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EXERCISE: ${{ inputs.exercise }}
          E2E_MARKERS: ${{ inputs.suite == 'smoke' && 'smoke' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
