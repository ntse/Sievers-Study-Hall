[project]
name = "sievers-study-hall"
version = "0.1.0"
description = "A study hall application"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Contributors", email = ""},
]

dependencies = [
    "altgraph==0.17.5",
    "blinker==1.9.0",
    "click==8.4.2",
    "Flask==3.1.0",
    "Flask-Login==0.6.3",
    "Flask-Mail==0.9.1",
    "Flask-Migrate==4.1.0",
    "Flask-Session==0.8.0",
    "Flask-SQLAlchemy==3.1.1",
    "Jinja2==3.1.5",
    "MarkupSafe==3.0.2",
    "SQLAlchemy==2.0.43",
    "Werkzeug==3.1.3",
    "alembic==1.17.2",
    "gunicorn==23.0.0",
    "huggingface_hub==1.29.0",
    "itsdangerous==2.2.0",
    "macholib==1.16.3",
    "modulegraph==0.19.6",
    "numpy==2.2.2",
    "packaging==26.3",
    "pandas==2.2.3",
    "py2app==0.28.8",
    "psycopg[binary]==3.2.10",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "pytz==2025.1",
    "setuptools==78.1.1",
    "six==1.17.0",
    "tzdata==2025.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "redis==5.2.1",
    "fakeredis==2.40.0",
    "ruff==0.9.0",
]

e2e = [
    "pytest==8.3.4",
    "pytest-playwright==0.7.2",
    "playwright==1.65.2",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",
    "W191",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
