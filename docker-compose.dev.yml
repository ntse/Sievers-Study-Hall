services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    depends_on:
      db:
        condition: service_healthy
    container_name: sievers-study-hall-dev
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-study_hall}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-study_hall}
      - POSTGRES_DB=${POSTGRES_DB:-study_hall}
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_SECRET_KEY=dev-secret-key-not-for-production
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/instance
    networks:
      - sievers-network
    command: sh -c "flask db upgrade && flask run --host=0.0.0.0"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study_hall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_hall}
      POSTGRES_DB: ${POSTGRES_DB:-study_hall}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - sievers-network
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres-data:

networks:
  sievers-network:
    driver: bridge
